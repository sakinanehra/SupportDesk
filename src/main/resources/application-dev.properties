# Local development conveniences. Activated with SPRING_PROFILES_ACTIVE=dev
# The password is still required from the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/supportdesk?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:supportdesk_app}

logging.level.com.supportdesk=DEBUG
spring.jpa.properties.hibernate.format_sql=true
