spring.application.name=supportdesk

# ---- Datasource: every value comes from an environment variable ----
# No defaults here on purpose: the app refuses to start if they are missing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- Flyway owns the schema; Hibernate only validates it ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# ---- JPA ----
# Do not keep DB sessions open during view rendering; forces explicit loading in services.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- JSON ----
# Reject unknown fields. A client sending {"companyId": 5} gets a 400 instead of being silently ignored.
spring.jackson.deserialization.fail-on-unknown-properties=true
